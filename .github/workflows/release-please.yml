# Release Please: maintains a release PR from conventional commits, and on
# merge tags the version + creates the GitHub Release that GoReleaser then
# attaches binaries to.
# Docs: https://github.com/googleapis/release-please-action
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: go
          # While in 0.x, treat `feat:` as a minor bump (0.1.0 -> 0.2.0)
          # instead of escalating to 1.0.0.
          bump-minor-pre-major: true
          # The initial release is forced to 0.1.0 via a Release-As footer
          # on the seed commit; subsequent bumps are derived from commits.
