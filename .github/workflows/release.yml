# Release pipeline: release-please maintains a release PR from conventional
# commits; when that PR is merged it tags a version and creates the GitHub
# Release, then GoReleaser attaches cross-platform binaries.
#
# Why a single workflow with a chained job (rather than a separate
# on: push: tags workflow for GoReleaser)? Tags pushed by the default
# GITHUB_TOKEN do NOT trigger downstream `push: tags` workflows (GitHub's
# anti-recursion rule). Chaining GoReleaser as a dependent job on
# release-please's `releases_created` output sidesteps that entirely and needs
# no PAT.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release-please.outputs.releases_created }}
      tag_name: ${{ steps.release-please.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-please
        with:
          release-type: go
          # While in 0.x, treat `feat:` as a minor bump (0.1.0 -> 0.2.0)
          # instead of escalating to 1.0.0.
          bump-minor-pre-major: true

  # Runs only when release-please actually created a release (i.e. the
  # release PR was merged), not on every push to main.
  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
