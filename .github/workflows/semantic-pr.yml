# Enforce conventional-commit PR titles so release-please can derive the correct
# semver bump (patch/minor/major) from each PR.
# Docs: https://github.com/amannn/action-semantic-pull-request
name: Semantic PR

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    # release/** is included so feature PRs into a release branch also have to
    # carry a conventional title — release-please derives the bump from them.
    branches: [main, 'release/**']

permissions:
  pull-requests: read

jobs:
  semantic-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # release-please recognizes these types. `feat` -> minor, `fix` ->
          # patch, `!` or BREAKING CHANGE -> major.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            chore
            ci
            build
            style
            release
          requireScope: false
